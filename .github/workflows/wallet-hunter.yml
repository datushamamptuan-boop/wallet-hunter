name: Wallet Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run wallet analysis
        shell: bash
        run: |
          if [ -f wallet_hunter.py ]; then
            python wallet_hunter.py
          elif [ -f main.py ]; then
            python main.py
          elif [ -f scripts/wallet_hunter.py ]; then
            python scripts/wallet_hunter.py
          else
            echo "ERROR: Could not find wallet_hunter.py, main.py, or scripts/wallet_hunter.py"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Commit generated results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update wallet analysis"
            git push
          fi
